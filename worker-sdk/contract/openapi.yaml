openapi: 3.1.0
info:
  title: Modelryx standalone CAD worker
  version: "1.0"
  description: >-
    Read-only CAD conversion protocol for independently deployed workers. Registration and
    embedded/external routing belong to Modelryx, not this worker API. See the SDK README
    for the generic publication profile, local preprocessor contract and FreeCAD fallback rules.
security:
  - WorkerKey: []
paths:
  /health:
    get:
      security: []
      responses:
        "200": {description: Worker process is alive}
  /ready:
    get:
      security: []
      responses:
        "200": {description: Worker can accept jobs}
        "503": {description: Worker is unavailable}
  /api/v1/capabilities:
    get:
      responses:
        "200":
          description: Supported conversion capabilities
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Capabilities"}
        "401": {description: Invalid worker key}
  /api/v1/jobs:
    post:
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [request, source]
              properties:
                request: {$ref: "#/components/schemas/JobRequest"}
                source: {type: string, format: binary}
            encoding:
              request: {contentType: application/json}
      responses:
        "202":
          description: Job accepted or replayed
          headers:
            Location: {required: true, schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JobRecord"}
        "400": {description: Invalid job or source}
        "401": {description: Invalid worker key}
        "409": {description: Job ID conflicts with an existing request}
        "429": {description: Worker has reached capacity}
  /api/v1/jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JobRecord"}
        "401": {description: Invalid worker key}
        "404": {description: Job unknown or reclaimed}
  /api/v1/jobs/{jobId}/cancel:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      responses:
        "202": {description: Cancellation requested}
        "401": {description: Invalid worker key}
        "404": {description: Job unknown or reclaimed}
  /api/v1/jobs/{jobId}/outputs/{role}:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - name: role
        in: path
        required: true
        schema: {$ref: "#/components/schemas/Role"}
    get:
      responses:
        "200":
          description: Finalized output bytes with the manifest media type
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        "401": {description: Invalid worker key}
        "404": {description: Output unavailable}
  /analyze:
    post:
      summary: Optional native CAD dependency analysis
      description: >-
        Available when dependencyAnalysis is true. The server authorizes the caller before
        forwarding the package. This discovers references without publishing engineering records;
        it is separate from the locally installed preprocessor executable.
      parameters:
        - name: X-Modelryx-Root-Path-B64
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/zip:
            schema: {type: string, format: binary}
      responses:
        "200":
          description: Dependency analysis report
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DependencyReport"}
              example:
                document_type: ASSEMBLY
                root_file: Root.cad
                root_logical_path: project/Root.cad
                files:
                  - {logical_path: project/Root.cad, is_root: true, document_type: ASSEMBLY}
                  - {logical_path: project/Part.cad, is_root: false, document_type: PART}
                references:
                  - {parent_logical_path: project/Root.cad, child_logical_path: project/Part.cad, instance_name: "part:1"}
                missing_references: []
        "401": {description: Invalid worker key}
        "422": {description: Invalid root or package}
components:
  securitySchemes:
    WorkerKey: {type: apiKey, in: header, name: X-Modelryx-Worker-Key}
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    Role: {type: string, pattern: "^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$"}
    Digest: {type: string, pattern: "^[0-9a-fA-F]{64}$"}
    Capabilities:
      description: >-
        Generic Modelryx registration requires native-snapshot, part-metadata and model-preview
        output roles. Other profiles, including the dedicated FreeCAD PFG client, may use a subset
        of these roles. Advertise only supported formats and outputs; re-register after changes.
      example:
        contractVersion: "1.0"
        cadSystem: freecad
        workerName: FreeCAD
        workerVersion: "1.0.0"
        documentKinds: [part, assembly]
        sourceExtensions: [.fcstd]
        outputRoles: [native-snapshot, part-metadata, model-preview, glb, modelryx-preview]
        dependencyAnalysis: true
      type: object
      required: [contractVersion, cadSystem, documentKinds, sourceExtensions, outputRoles]
      properties:
        contractVersion: {const: "1.0"}
        cadSystem: {type: string, minLength: 1}
        documentKinds: {type: array, items: {type: string}}
        workerName: {type: string, description: Human-readable worker name}
        workerVersion: {type: string, description: Worker release version}
        sourceExtensions: {type: array, items: {type: string, pattern: "^\\."}}
        outputRoles: {type: array, items: {$ref: "#/components/schemas/Role"}}
        dependencyAnalysis: {type: boolean, description: Implements the optional authenticated POST /analyze endpoint; independent of local preprocessor installation}
        processingProfile: {$ref: "#/components/schemas/ProcessingProfile"}
    ProcessingProfile:
      description: >-
        Optional worker-owned conversion policy. preferredOutputs must cover exactly the advertised
        documentKinds and use advertised, non-required output roles. Bundle publication requires an
        exact supported output contract; CAD system and registration ID do not select this policy.
      type: object
      required: [preferredOutputs]
      properties:
        preferredOutputs:
          type: object
          minProperties: 1
          maxProperties: 5
          additionalProperties:
            type: array
            maxItems: 32
            uniqueItems: true
            items: {$ref: "#/components/schemas/Role"}
        outputContracts:
          type: object
          maxProperties: 3
          additionalProperties: false
          properties:
            component-geometry: {const: component-geometry-step-v1}
            drawing-representations: {const: related-drawing-v1}
            manufacturing-outputs: {const: manufacturing-outputs-v1}
        includeRelatedDrawings:
          type: boolean
          default: false
          description: Include supported authoritative drawing sources from the same snapshot; requires drawing support.
    JobRequest:
      description: >-
        Generic publication requests native-snapshot, part-metadata and model-preview and prefers
        glb when advertised. Required roles must be produced; unsupported preferred roles may be
        omitted. Source hashes and sizes describe the exact uploaded native file or dependency ZIP.
      example:
        contractVersion: "1.0"
        jobId: 95fc8a83-24cc-409a-b121-b4b951bfbf2c
        attempt: 1
        cadSystem: freecad
        documentKind: assembly
        source:
          snapshotId: ed42e268-91bb-48bd-8eb6-74182443c31e
          sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          size: 24576
          rootPath: Pump.FCStd
        configuration: null
        requiredOutputs: [native-snapshot, part-metadata, model-preview]
        preferredOutputs: [glb]
        expiresAt: "2030-01-01T00:00:00Z"
      type: object
      required: [contractVersion, jobId, attempt, cadSystem, documentKind, source, configuration, requiredOutputs, preferredOutputs, expiresAt]
      properties:
        contractVersion: {const: "1.0"}
        jobId: {type: string, format: uuid}
        attempt: {type: integer, minimum: 1}
        cadSystem: {type: string, minLength: 1}
        documentKind: {type: string, minLength: 1}
        source:
          type: object
          required: [snapshotId, sha256, size, rootPath]
          properties:
            snapshotId: {type: string, format: uuid}
            sha256: {$ref: "#/components/schemas/Digest"}
            size: {type: integer, minimum: 1}
            rootPath: {type: string, minLength: 1}
        configuration: {type: [object, "null"]}
        requiredOutputs: {type: array, minItems: 1, uniqueItems: true, items: {$ref: "#/components/schemas/Role"}}
        preferredOutputs: {type: array, uniqueItems: true, items: {$ref: "#/components/schemas/Role"}}
        expiresAt: {type: string, format: date-time}
    Output:
      type: object
      required: [role, mediaType, size, sha256, downloadUrl, provenance]
      properties:
        role: {$ref: "#/components/schemas/Role"}
        mediaType: {type: string, minLength: 1}
        size: {type: integer, minimum: 1}
        sha256: {$ref: "#/components/schemas/Digest"}
        downloadUrl: {type: string, pattern: "^/api/v1/jobs/"}
        provenance:
          type: object
          required: [source_role, generator]
          properties:
            source_role: {type: string, minLength: 1}
            generator: {type: string, minLength: 1}
    JobResult:
      type: object
      required: [contractVersion, jobId, attempt, cadSystem, configuration, sourceSha256, adapterVersion, status, warnings, outputs]
      properties:
        contractVersion: {const: "1.0"}
        jobId: {type: string, format: uuid}
        attempt: {type: integer, minimum: 1}
        cadSystem: {type: string}
        configuration: {type: [object, "null"]}
        sourceSha256: {$ref: "#/components/schemas/Digest"}
        adapterVersion: {type: string, minLength: 1}
        cadVersion: {type: [string, "null"]}
        status: {enum: [complete, partial]}
        warnings: {type: array, items: {type: string, minLength: 1}}
        outputs: {type: array, items: {$ref: "#/components/schemas/Output"}}
        diagnostics: {}
    JobRecord:
      type: object
      required: [id, state, stage, progress]
      properties:
        id: {type: string, format: uuid}
        state: {enum: [Queued, Reconstructing, Extracting, Validating, ReadyToPublish, Partial, Failed, Cancelled, Expired]}
        stage: {type: string}
        progress: {type: integer, minimum: 0, maximum: 100}
        result: {$ref: "#/components/schemas/JobResult"}
        error:
          type: object
          required: [code, message, retryable, stage]
          properties:
            code: {type: string}
            message: {type: string}
            retryable: {type: boolean}
            stage: {type: string}

    DependencyFile:
      type: object
      required: [logical_path, is_root]
      properties:
        logical_path: {type: string, minLength: 1, description: Package-relative POSIX path}
        is_root: {type: boolean}
        document_type: {type: [string, "null"]}
    DependencyReference:
      type: object
      required: [parent_logical_path, child_logical_path]
      properties:
        parent_logical_path: {type: string, minLength: 1}
        child_logical_path: {type: string, minLength: 1}
        instance_name: {type: [string, "null"]}
        occurrence_id: {type: [string, "null"]}
        occurrence_key: {type: [string, "null"]}
        transform: {type: [array, "null"], minItems: 16, maxItems: 16, items: {type: number}}
        is_visible: {type: [boolean, "null"]}
        is_suppressed: {type: [boolean, "null"]}
        source_reference: {type: [string, "null"]}
        reference_designator: {type: [string, "null"]}
        properties: {type: object}
    MissingReference:
      type: object
      required: [reference, referenced_by]
      properties:
        reference: {type: [string, "null"]}
        referenced_by: {type: string, minLength: 1}
        kind: {type: string}
        suggestion: {type: [string, "null"]}
    DependencyReport:
      description: >-
        Native dependency evidence for review; not a published BOM. Missing references must
        be resolved before the source package is accepted. Local executable reports additionally
        provide contract_version, analyzer_version and isolated_reopen_validated as documented
        in the SDK README; an optional package path is local-only, not an HTTP download URL.
      type: object
      required: [document_type, root_file, root_logical_path, files, references, missing_references]
      properties:
        document_type: {type: string, minLength: 1}
        root_file: {type: string, minLength: 1}
        root_logical_path: {type: string, minLength: 1}
        files: {type: array, minItems: 1, items: {$ref: "#/components/schemas/DependencyFile"}}
        references: {type: array, items: {$ref: "#/components/schemas/DependencyReference"}}
        missing_references: {type: array, items: {$ref: "#/components/schemas/MissingReference"}}
