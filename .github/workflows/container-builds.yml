name: Container Builds
on:
  pull_request:
  push:
    branches: [main, develop]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: server, context: ., file: server/Dockerfile}
          - {name: step-worker, context: workers/step, file: workers/step/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: ${{ matrix.name == 'step-worker' }}
          push: false
          tags: modelryx/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Run STEP native converter tests
        if: matrix.name == 'step-worker'
        run: >-
          docker run --rm modelryx/step-worker:ci
          python -m pytest -q tests/test_step_metadata.py tests/test_component_bundle_to_glb.py
      - name: Run STEP service smoke test
        if: matrix.name == 'step-worker'
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name modelryx-step-smoke --env MODELRYX_INTERNAL_WORKER_KEY=ci-only-worker-key modelryx/step-worker:ci
          for attempt in $(seq 1 60); do
            if docker exec modelryx-step-smoke python -c "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready')"; then
              docker exec modelryx-step-smoke python /app/tests/compose_smoke.py
              exit 0
            fi
            sleep 2
          done
          echo "STEP worker did not become ready"
          exit 1
      - name: Show STEP service logs
        if: always() && matrix.name == 'step-worker'
        run: docker logs modelryx-step-smoke
      - name: Clean up STEP service
        if: always() && matrix.name == 'step-worker'
        run: docker rm --force modelryx-step-smoke
