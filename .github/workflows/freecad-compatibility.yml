name: FreeCAD compatibility fixtures

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-fixtures:
    name: FreeCAD ${{ matrix.freecad_version }} compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: ${{ matrix.freecad_version != '1.1.3' }}
    strategy:
      fail-fast: false
      matrix:
        freecad_version: ['1.0.0', '1.1.3', '2026.09.16']
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for native CAD runtime
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup /opt/ghc
          df -h /
      - name: Build candidate FreeCAD runtime
        run: >-
          docker build --file workers/freecad/Dockerfile --target native-tests
          --build-arg MODELRYX_FREECAD_VERSION=${{ matrix.freecad_version }}
          --tag modelryx-freecad-compat workers/freecad
      - name: Prepare native test memory
        run: bash workers/freecad/scripts/ci-memory.sh prepare
      - name: Golden native fixtures
        run: bash workers/freecad/scripts/run-native-gate.sh /app/converter/golden_integration_test.py modelryx-freecad-compat
      - name: Nested dependency fixtures
        run: bash workers/freecad/scripts/run-native-gate.sh /app/preprocessor/dependency_integration_test.py modelryx-freecad-compat
      - name: Production native fixtures
        run: bash workers/freecad/scripts/run-native-gate.sh /app/converter/production_fixture_test.py modelryx-freecad-compat --compatibility-candidate
      - name: Process-tree cleanup fixtures
        run: bash workers/freecad/scripts/run-native-gate.sh /app/tests/process_tree_integration_test.py modelryx-freecad-compat
      - name: Native runner diagnostics
        if: failure()
        run: |
          free -h
          df -h /
          sudo dmesg --ctime | tail -80 || true
      - name: Clean up native test swap
        if: always()
        run: bash workers/freecad/scripts/ci-memory.sh cleanup
