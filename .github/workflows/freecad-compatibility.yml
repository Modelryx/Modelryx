name: FreeCAD compatibility fixtures

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-fixtures:
    name: FreeCAD ${{ matrix.freecad_version }} compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: ${{ matrix.freecad_version != '1.1.3' }}
    strategy:
      fail-fast: false
      matrix:
        freecad_version: ['1.0.0', '1.1.3', '2026.09.16']
    steps:
      - uses: actions/checkout@v4
      - name: Build candidate FreeCAD runtime
        run: >-
          docker build --file workers/freecad/Dockerfile
          --build-arg MODELRYX_FREECAD_VERSION=${{ matrix.freecad_version }}
          --tag modelryx-freecad-compat .
      - name: Test native metadata and dependency fixtures
        run: |
          docker run --rm modelryx-freecad-compat python /opt/modelryx-converter/golden_integration_test.py
          docker run --rm modelryx-freecad-compat python /opt/modelryx-preprocessor/dependency_integration_test.py
          docker run --rm modelryx-freecad-compat python /opt/modelryx-converter/production_fixture_test.py --compatibility-candidate
