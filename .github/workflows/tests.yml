name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: modelryx_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: modelryx_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        cd server
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Lint with flake8
      run: |
        cd server
        flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true
    
    - name: Test with pytest
      env:
        MODELRYX_DATABASE_URL: postgresql://modelryx_test:test_password@localhost:5432/modelryx_test
        MODELRYX_ENVIRONMENT: test
        MODELRYX_JWT_SECRET: test_secret_key_very_long_and_secure_key_for_testing
        MODELRYX_WORKER_KEY: test_worker_key_very_long_and_secure_key_for_testing
        MODELRYX_MINIO_URL: http://localhost:9000
        MODELRYX_MINIO_KEY: test_key
        MODELRYX_MINIO_SECRET: test_secret
      run: |
        cd server
        pytest tests/ -v --cov=src --cov-report=xml
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./server/coverage.xml
        flags: backend
        fail_ci_if_error: false

  frontend-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: front-end/package-lock.json
    
    - name: Install dependencies
      run: |
        cd front-end
        npm ci --legacy-peer-deps
        npm rebuild esbuild @rollup/rollup-linux-x64-gnu 2>/dev/null || true
    
    - name: Run linter
      run: |
        cd front-end
        npm run lint
      continue-on-error: true
    
    - name: Type checking
      run: |
        cd front-end
        npm run type-check
      continue-on-error: true
    
    - name: Build
      run: |
        cd front-end
        npm run build
    
    - name: Test
      run: |
        cd front-end
        npm run test
      continue-on-error: true
