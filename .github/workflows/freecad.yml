name: FreeCAD CI
on:
  pull_request:
    paths: ["workers/freecad/**", "worker-sdk/**", "!workers/freecad/*.md", "!workers/freecad/**/*.md", "!worker-sdk/*.md", "!worker-sdk/**/*.md"]
  push:
    branches: [main, develop]
    paths: ["workers/freecad/**", "worker-sdk/**", "!workers/freecad/*.md", "!workers/freecad/**/*.md", "!worker-sdk/*.md", "!worker-sdk/**/*.md"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  freecad-worker:
    name: FreeCAD worker
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: workers/freecad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install ./vendor/worker-sdk -r standalone/requirements.txt -r requirements-test.txt
      - name: Run FreeCAD unit tests
        run: python -m pytest -q tests
      - run: python -m compileall -q converter preprocessor shared standalone
      - name: Free disk space for native CAD runtime
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup /opt/ghc
          df -h /
      - name: Prepare native build and test memory
        run: bash scripts/ci-memory.sh prepare
      - name: Set up Docker containerd image store
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {"features": {"containerd-snapshotter": true}}
      - name: Set up native Docker builder
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker
      - name: Build native FreeCAD worker image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: workers/freecad
          file: workers/freecad/Dockerfile
          target: native-tests
          # The Docker driver stores the image locally without a separate --load export.
          load: false
          push: false
          tags: modelryx-freecad-ci
          provenance: false
          sbom: false
          cache-from: type=gha,version=2,scope=freecad-native-1.1.3,timeout=5m
          cache-to: type=gha,version=2,scope=freecad-native-1.1.3,mode=max,timeout=5m,ignore-error=true
      - name: Golden native fixtures
        run: bash scripts/run-native-gate.sh /app/converter/golden_integration_test.py modelryx-freecad-ci
      - name: Nested dependency fixtures
        run: bash scripts/run-native-gate.sh /app/preprocessor/dependency_integration_test.py modelryx-freecad-ci
      - name: Production native fixtures
        run: bash scripts/run-native-gate.sh /app/converter/production_fixture_test.py modelryx-freecad-ci
      - name: Process-tree cleanup fixtures
        run: bash scripts/run-native-gate.sh /app/tests/process_tree_integration_test.py modelryx-freecad-ci
      - name: Native runner diagnostics
        if: failure()
        run: |
          free -h
          df -h /
          sudo dmesg --ctime | tail -80 || true
      - name: Clean up native test swap
        if: always()
        run: bash scripts/ci-memory.sh cleanup
  worker-security:
    name: FreeCAD security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Scan worker dependencies and configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: workers/freecad
          format: sarif
          output: freecad-trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freecad-security-results
          path: freecad-trivy-results.sarif
          if-no-files-found: error
