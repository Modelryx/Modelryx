[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelryx-server"
version = "0.1.0"
description = "CAD-neutral part management API"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jsonschema[format]>=4.23,<5",
  "Pillow>=11,<13",
  "modelryx-worker-sdk>=0.1.0,<0.2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pgvector>=0.4,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/server/modelryx"]

[tool.pytest.ini_options]
pythonpath = ["src/server", "../worker-sdk/src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
